defaults
  mode http
  timeout connect 2s
  timeout client 10s
  timeout server 10s
frontend fe
  bind *:8080
  default_backend app
backend app
  option httpchk GET /healthz
  server private host.docker.internal:30080 check inter 2s fall 2 rise 1
  server public  host.docker.internal:30081 check inter 2s fall 2 rise 1 backup
