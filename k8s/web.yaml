apiVersion: apps/v1
kind: Deployment
metadata: {name: web}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: web
        image: visitor-counter:optimized
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 5000}]
        env:
        - {name: REDIS_HOST, value: redis}
        - {name: REDIS_PORT, value: "6379"}
        - name: CLUSTER_NAME
          value: CLUSTER_PLACEHOLDER
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 250m, memory: 128Mi}
        readinessProbe:
          httpGet: {path: /healthz, port: 5000}
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata: {name: web}
spec:
  type: NodePort
  selector: {app: web}
  ports: [{port: 80, targetPort: 5000, nodePort: NODEPORT_PLACEHOLDER}]
